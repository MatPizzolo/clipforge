name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (with libass)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # The single gate (decision log #380): ruff, format, mypy, fast tests, OpenAPI contract, docs
      - run: scripts/check.sh --python --docs

  scope:
    # Files outside the branch's scope, and decision-log rows outside its range (scripts/scopes.toml)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope check
        run: python3 scripts/check_scope.py --base "origin/${{ github.base_ref }}"

  deploy:
    # ADR-16: merged to main means live. Never runs on pull requests.
    needs: check
    # Off until ci.yml runs the migrations first (decision log #109).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run modal deploy src/clipforge/app.py

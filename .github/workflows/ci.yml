name: CI

# One run per commit (card 017): pushes to main (they deploy), and pull requests. A push to any
# other branch runs nothing until its PR is open.
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the tag job (after a deploy) may push, and only tags (card 008).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never on main: a newer push must not cancel a deploy that is waiting out a blackout or
  # running (card 002 final review)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Docs-only or code (scripts/ci_changes.py). No workflow-level `paths:`: `check` and `scope`
    # are required checks, and a required check skipped by a path filter stays pending forever.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the last successful run on main (a push's base)
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Docs only, or code?
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR: against its base branch. A push to main: against the last successful run on
          # main, the deploy job's base, not the previous push: after a failed code push, a
          # docs-only push must not pass `check` on the docs tests and let deploy ship the
          # untested code. No earlier successful run (or an unknown commit) counts as code.
          if [ "$EVENT" = pull_request ]; then
            BASE="origin/$BASE_REF"
          else
            BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                     --event push --status success --limit 1 --json headSha --jq '.[0].headSha' \
                   2>/dev/null || true)
          fi
          # PRs: three dots (what the branch changed since it left its base). Pushes: two dots
          # (the trees themselves, as the deploy job diffs), so a non-linear main hides nothing.
          if [ "$EVENT" = pull_request ]; then DIFF=three-dot; else DIFF=two-dot; fi
          python3 scripts/ci_changes.py --base "$BASE" --diff "$DIFF" --output "$GITHUB_OUTPUT"

  check:
    # Always runs, so it always reports a conclusion: the docs tests alone for a docs-only
    # change, the whole gate otherwise. The name stays `check` (branch protection requires it).
    # Not skipped when `changes` fails (a skipped required check counts as passed): it fails,
    # and a missing `code` output runs the whole gate.
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: The change classifier must have succeeded
        if: needs.changes.result != 'success'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "the changes job ended with '$RESULT': nothing was checked" >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # A plain apt install (18-36 s). Not cached: cache-apt-pkgs restores files without running
      # postinst, so update-alternatives links such as libblas.so.3 are missing (PR #37).
      - name: Install ffmpeg (with libass)
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: ffmpeg version (Ubuntu 24.04's 6.1, with libass)
        if: needs.changes.outputs.code != 'false'
        run: |
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -E '^ ... (ass|subtitles) '
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The single gate (decision log #380): ruff, format, mypy, fast tests, OpenAPI contract, docs
      - name: scripts/check.sh --python --docs
        if: needs.changes.outputs.code != 'false'
        run: scripts/check.sh --python --docs
      - name: scripts/check.sh --docs (docs-only change)
        if: needs.changes.outputs.code == 'false'
        run: scripts/check.sh --docs
      - name: Keep the failing step's full output (card 008)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: check-last-fail
          path: .superpowers/check-last-fail.log
          include-hidden-files: true  # .superpowers/ is a dot directory
          if-no-files-found: ignore

  scope:
    # Files outside the branch's scope, and decision-log rows outside its range (scripts/scopes.toml)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Scope check
        run: python3 scripts/check_scope.py --base "origin/${{ github.base_ref }}"

  deploy:
    # ADR-16: merged to main means live. Never runs on pull requests.
    needs: check
    # Off until the owner sets DEPLOY_ENABLED (decision log #109); the migration below runs first.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # the last successful run on main (the change filter's base)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:  # read by the tag job; empty when nothing was deployed
      tag: ${{ steps.deployed.outputs.tag }}
      when: ${{ steps.deployed.outputs.when }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Skip when only the dashboard or docs changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The base is the last successful run on main, not the previous push: a deploy that
          # failed or was cancelled is retried by the next push, even a docs-only one.
          BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
                   --event push --status success --limit 1 --json headSha --jq '.[0].headSha' \
                 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no earlier successful run on main: deploy"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # anything outside web/, docs/ and top-level *.md files is a reason to deploy
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(web/|docs/|[^/]+\.md$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "only web/ or docs changed since $BASE: no deploy"
          fi
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        if: steps.changes.outputs.deploy == 'true'
        with:
          enable-cache: true
      - run: uv sync --locked
        if: steps.changes.outputs.deploy == 'true'
      - name: Migrate the database (ADR-26, before the code that needs it)
        if: steps.changes.outputs.deploy == 'true'
        run: uv run alembic upgrade head
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: "Deploy blackout (runbook §1, decision log #108)"
        # The same rule as scripts/deploy.sh: never from a posting slot until 30 min after it.
        # Checked last, right before the deploy (the migration takes minutes and changes
        # nothing the running code reads: migrations are additive).
        # POSTING_SLOTS and POSTING_TIMEZONE are repository variables, identical to
        # clipforge-secrets; missing ones fail the job (no defaults). Inside a blackout it waits.
        if: steps.changes.outputs.deploy == 'true'
        env:
          POSTING_SLOTS: ${{ vars.POSTING_SLOTS }}
          POSTING_TIMEZONE: ${{ vars.POSTING_TIMEZONE }}
        run: |
          uv run python - <<'PY'
          import os, sys, time
          from datetime import UTC, datetime
          sys.path.insert(0, "scripts")
          from deploy import BLACKOUT, blackout_slot
          from clipforge.schedule import normalize_slots, schedule_problem
          raw_slots, zone = os.environ["POSTING_SLOTS"].strip(), os.environ["POSTING_TIMEZONE"].strip()
          if not raw_slots or not zone:
              sys.exit("set the repository variables POSTING_SLOTS and POSTING_TIMEZONE")
          slots = normalize_slots([s.strip() for s in raw_slots.split(",") if s.strip()])
          problem = schedule_problem(zone, slots, [])
          if problem is not None:
              sys.exit(f"POSTING_{problem[0].upper()}: {problem[1]}")
          for _ in range(3):
              slot = blackout_slot(slots, zone, datetime.now(UTC))
              if slot is None:
                  print("outside every posting blackout")
                  sys.exit(0)
              wait = (slot + BLACKOUT - datetime.now(UTC)).total_seconds() + 60
              print(f"in the blackout of the {slot:%H:%M} slot: waiting {wait / 60:.0f} min")
              time.sleep(max(wait, 0))
          sys.exit("still in a blackout after waiting")
          PY
      - name: Deploy time (the tag's name, as scripts/deploy.sh names it)
        id: when
        if: steps.changes.outputs.deploy == 'true'
        run: |
          NOW=$(date -u '+%s')
          echo "now=$(date -u -d "@$NOW" '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
          echo "tag=deploy-$(date -u -d "@$NOW" '+%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
      - run: uv run modal deploy src/clipforge/app.py
        if: steps.changes.outputs.deploy == 'true'
        env:  # the Modal tokens only here, not in the steps before
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GIT_SHA: ${{ github.sha }}
      - name: Hand the tag to the tag job (only after a successful deploy)
        id: deployed
        if: steps.changes.outputs.deploy == 'true'
        env:
          WHEN: ${{ steps.when.outputs.now }}
          TAG: ${{ steps.when.outputs.tag }}
        run: |
          echo "when=$WHEN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  tag:
    # Card 008: a CI deploy leaves the same record as scripts/deploy.sh, a deploy-YYYYMMDD-HHMM
    # tag on origin, plus its docs/ops/deploys.md line in the run summary (CI can't commit to
    # main). Its own job, so only the tag push gets `contents: write`.
    needs: deploy
    if: needs.deploy.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Push the deploy tag
        env:
          TAG: ${{ needs.deploy.outputs.tag }}
          WHEN: ${{ needs.deploy.outputs.when }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          # the deploys.md line, as scripts/deploy.py's log_line writes it
          REASON=$(printf '%s' "$MESSAGE" | head -n 1 | tr '|' '/')
          {
            echo "Deployed ${GITHUB_SHA::7}, tagged \`$TAG\`. Deploy log line:"
            echo
            echo "| When (UTC) | Commit | Tag | By | Why |"
            echo "|---|---|---|---|---|"
            echo "| $WHEN | ${GITHUB_SHA::7} | $TAG | CI ($ACTOR) | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"

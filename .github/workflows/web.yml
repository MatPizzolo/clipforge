name: web

on:
  push:
    paths:
      - "web/**"
      - "scripts/export_openapi.py"
      - "scripts/check.sh"
      # Everything the OpenAPI export imports or installs:
      - "src/clipforge/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/export_openapi.py"
      - "scripts/check.sh"
      # Everything the OpenAPI export imports or installs:
      - "src/clipforge/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/web.yml"

# Read-only: this workflow never deploys or writes.
permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # lint, typecheck, unit tests, build, generated schemas, Playwright smoke (mock API).
      # The OpenAPI export check runs in ci.yml (scripts/check.sh --python) on every push.
      - name: scripts/check.sh --web --e2e
        run: scripts/check.sh --web --e2e
        env:
          CI: "true"

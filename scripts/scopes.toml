    "ROADMAP.md",
    "CLAUDE.md",
]

[prefix."s2c/"]
stream = "s2c"
log = [530, 549]
allow = [
    "src/**",
    "tests/**",
    "alembic/**",
    "alembic.ini",
    ".env.example",
    "pyproject.toml",
    "uv.lock",
    "web/openapi.json",
    "web/lib/api/**",
    "web/lib/mocks.ts",
    "web/tests/unit/summaries.test.ts",
    "docs/ops/secrets.md",
    "docs/ARCHITECTURE.md",
    "docs/superpowers/plans/*-studio-s2*",
    "docs/studio/04-roadmap.md",
    "ROADMAP.md",
    "CLAUDE.md",
]
